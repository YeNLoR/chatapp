<dialog id="addFriendModal" class="modal">
  <div class="modal-box">
    <form action="/profile/friendship-request/" method="post">
      {% csrf_token %}
      <label for="friend_name" class="input">
        Kullanıcı adı:
        <input name="friend_username" type="text" />
      </label>
      <button type="submit" class="btn btn-ghost">ekle</button>
    </form>
  </div>
  <form method="dialog" class="modal-backdrop">
    <button>close</button>
  </form>
</dialog>
