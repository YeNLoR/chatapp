<c-vars server="" />
<a
  href="/channel/{{server.id}}/"
  class="flex flex-col p-1"
  hx-get="/channel/{{server.id}}/"
  hx-target="#channelList"
  hx-swap="innerHTML"
  hx-push-url="true"
  data-tooltip="{{server.name}}"
  onclick="joinServerView('{{server.id}}')"
>
  <c-avatar :img="server.img.url" />
</a>
