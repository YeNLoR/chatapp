{%load lucide%}
<dialog id="ongoingCallModal" class="modal">
  <div class="modal-box max-w-[90vw]">
    <div class="flex flex-col">
      <span class="mx-auto">Devam eden çağrı</span>
      <div
        class="flex flex-row flex-wrap items-center justify-center"
        id="videoGrid"
      >
        <div class="m-auto flex-1">
          <video
            id="localVideo"
            muted
            autoplay
            playsinline
            onclick="videoLightbox(this)"
          />
        </div>
      </div>
      <div class="mt-3 flex flex-row justify-around">
        <button
          id="ongoingMic"
          onclick="toggleAudio()"
          class="btn btn-success btn-circle"
        >
          {% lucide "mic" %}
        </button>
        <button
          id="ongoingCam"
          onclick="
            if (camShare) toggleVideo();
            else switchToCamera();
          "
          class="btn btn-error btn-circle"
        >
          {% lucide "video" %}
        </button>
        <button
          id="ongoingScreen"
          onclick="
            if (screenShare) toggleVideo();
            else switchToScreenShare();
          "
          class="btn btn-error btn-circle"
        >
          {% lucide "screen-share" %}
        </button>
        <button
          id="endOngoingCall"
          onclick="
            leaveCall();
            this.closest('dialog').close();
          "
          class="btn btn-error btn-circle"
        >
          {% lucide "phone" class="rotate-135" %}
        </button>
      </div>
    </div>
  </div>
  <form method="dialog" class="modal-backdrop">
    <button>close</button>
  </form>
</dialog>
