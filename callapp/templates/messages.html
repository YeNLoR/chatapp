{% partialdef content %}
<div id="messages" class="flex h-dvh grow flex-col justify-end">
  {% for item in current_channel.messages.all%}
  <div class="flex flex-row">
    <c-avatar :img="item.user.avatar.url" />
    <div class="flex flex-col">
      <p class="text-base leading-5 opacity-70">{{item.user.username}}</p>
      <p class="text-base leading-5">{{item.message}}</p>
    </div>
  </div>
  {% endfor %}
</div>
<div>
  <form
    id="messageForm"
    class="flex flex-row"
    hx-post="message/"
    hx-swap="none"
  >
    <textarea
      id="messageInput"
      class="input grow"
      name="{{ message_form.message.html_name }}"
    ></textarea>
    <button id="messageSubmit" type="submit" class="btn btn-neutral">
      gönder
    </button>
  </form>
</div>

{% endpartialdef %} {% partial content %}
