{% extends "index.html" %}{% partialdef content %}
<ul class="menu w-full p-0">
  {% if friend_list %} {% for item in friend_list%}
  <li>
    <a
      href="/channel/{{item.server.id}}/{{item.id}}/"
      class="text-base font-medium"
      hx-get="/channel/{{item.server.id}}/{{item.id}}/"
      hx-target="#messageList"
      hx-swap="innerHTML"
      hx-push-url="true"
      >{{item.username}}</a
    >
  </li>
  {% endfor %} {% endif %}
  <li>
    <button class="btn btn-ghost" data-modal="addFriendModal">
      arkadaş ekle
    </button>
  </li>
</ul>
<!--prettier-ignore-->
{% endpartialdef %} {% block sidebar %} {% partial content %} {% endblock %}
{% block main %} {% endblock %}
