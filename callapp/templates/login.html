{% extends "base.html" %}{% load lucide %} 
{% block content %}
<form action="/login/" method="post" class="flex flex-col grow justify-center">
    <div class="flex flex-col self-center">
        {%csrf_token%}
        <label class="input validator">
        {% lucide "user" class="opacity-50" size="21" %}
        <input
            type="text"
            required
            placeholder="Kullanıcı Adı"
            pattern="[A-Za-z][A-Za-z0-9\-]*"
            minlength="3"
            maxlength="30"
            title="kelime 3 ile 30 karakter arasında olmalı, sadece harf, rakam veya tire içerebilir"
        />
        </label>
        <p class="validator-hint hidden">
        Kelime 3 ile 30 karakter arasında olmalı sadece harf, rakam veya tire içerebilir
        </p>
        <label class="input validator mt-2">
        {% lucide "key-square" class="opacity-50" size="21" %}
        <input
            type="password"
            required
            placeholder="Şifre"
            minlength="8"
            pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
            title="8 karakterden uzun olmalı, en az bir rakam, bir küçük harf ve bir büyük harf içermelidir"
        />
        </label>
        <p class="validator-hint hidden">
        8 karakterden uzun olmalı en az bir rakam bir küçük harf ve bir büyük harf içermelidir
        </p>
        <br/>
        <button type="submit" class="btn btn-active shrink grow mt-2">Giriş Yap</button>
    </div>
</form>
{% endblock %}
