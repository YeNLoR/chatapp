{% extends "base.html" %}{% load lucide %} {% block content %}
<div class="flex min-h-screen min-w-full justify-center">
  <form
    action="/login/"
    method="post"
    class="form max-w-150 min-w-150 self-center pt-3 pr-4 pb-3 pl-4"
  >
    <div class="flex flex-col gap-1 border p-4">
      {%csrf_token%}
      <label class="input validator min-w-full">
        {% lucide "user" class="opacity-50" size="21" %}
        <input
          type="text"
          required
          placeholder="Kullanıcı Adı"
          pattern="[A-Za-z][A-Za-z0-9\-]*"
          minlength="3"
          maxlength="30"
          title="kelime 3 ile 30 karakter arasında olmalı, sadece harf, rakam veya tire içerebilir"
          name="{{ form.username.html_name }}"
          id="{{ form.username.html_name }}"
          value="{{ form.username.value|default:''}}"
        />
      </label>
      <p class="validator-hint hidden">
        Kelime 3 ile 30 karakter arasında olmalı sadece harf, rakam veya tire
        içerebilir
      </p>
      <label class="input validator mt-2 min-w-full">
        {% lucide "key-square" class="opacity-50" size="21" %}
        <input
          type="password"
          required
          placeholder="Şifre"
          minlength="8"
          pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
          title="8 karakterden uzun olmalı, en az bir rakam, bir küçük harf ve bir büyük harf içermelidir"
          name="{{ form.password.html_name }}"
          id="{{ form.password.html_name }}"
        />
      </label>
      <p class="validator-hint hidden">
        8 karakterden uzun olmalı en az bir rakam bir küçük harf ve bir büyük
        harf içermelidir
      </p>
      <br />
      <button type="submit" class="btn btn-active mt-2">Giriş Yap</button>
    </div>
  </form>
</div>
{% endblock %}
