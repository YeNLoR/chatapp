<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/build.css' %}" />
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
    <script src="{% static 'js/htmx.min.js' %}"></script>
    <script defer src="{% static 'js/script.js' %}"></script>
    <title>callapp</title>
  </head>
  <body hx-headers='{"x-csrftoken": "{{csrf_token}}"}'>
    {% block content %} {% endblock %}
  </body>
  <section id="templates">
    <template id="messageTemplate">
      <div class="flex flex-row">
        <c-avatar img="/imgurl" />
        <div class="flex flex-col">
          <p
            id="messageTemplateUsername"
            class="text-base leading-5 opacity-70"
          >
            username
          </p>
          <p id="messageTemplateContent" class="text-base leading-5">message</p>
        </div>
      </div>
    </template>
  </section>
  <section id="modals">
    <dialog id="newServerModal" class="modal">
      <div class="modal-box">
        <form action="/createserver/" method="post">
          {% csrf_token %}
          <label for="servername" class="input">
            sunucu adı:
            <input name="{{ server_form.name.html_name }}" type="text" />
          </label>
          <button type="submit" class="btn btn-ghost">ekle</button>
        </form>
      </div>
      <form method="dialog" class="modal-backdrop">
        <button>close</button>
      </form>
    </dialog>
    <dialog id="newChannelModal" class="modal">
      <div class="modal-box">
        <form action="createchannel/" method="post">
          {% csrf_token %}
          <label for="servername" class="input">
            kanal adı:
            <input name="{{ channel_form.name.html_name }}" type="text" />
          </label>
          <button type="submit" class="btn btn-ghost">ekle</button>
        </form>
      </div>
      <form method="dialog" class="modal-backdrop">
        <button>close</button>
      </form>
    </dialog>
  </section>
</html>
