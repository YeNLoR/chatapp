{% load lucide %}
<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/build.css' %}" />
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
    <script src="{% static 'js/htmx.min.js' %}"></script>
    <script defer src="{% static 'js/script.js' %}"></script>
    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
    <title>Ne Var Ne Yok</title>
  </head>
  <body hx-headers='{"x-csrftoken": "{{csrf_token}}"}'>
    {% block content %} {% endblock %}
  </body>
  <section id="templates">
    <template id="messageTemplate">
      <div class="flex flex-row">
        <c-avatar img="/imgurl" />
        <div class="flex flex-col">
          <p
            id="messageTemplateUsername"
            class="text-base leading-5 opacity-70"
          >
            username
          </p>
          <p id="messageTemplateContent" class="text-base leading-5">message</p>
        </div>
      </div>
    </template>
  </section>
  <section id="modals">
    <c-new-server-modal />
    <c-new-channel-modal />
    <c-add-friend-modal />
    <c-login-modal />
    <c-register-modal />
    <c-incoming-call-modal />
    <c-ongoing-call-modal />
    <c-lightbox-modal />
  </section>
</html>
